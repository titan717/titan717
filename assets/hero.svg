<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">TITAN717</title><desc id="desc">Midnight purple banner with a softly animated orbit and a personal wordmark.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10091d"/><stop offset=".58" stop-color="#211238"/><stop offset="1" stop-color="#090711"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a855f7"/><stop offset=".52" stop-color="#e879f9"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#9333ea" stop-opacity=".36"/><stop offset="1" stop-color="#9333ea" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="1200" height="340" rx="26" fill="url(#bg)"/>
<ellipse cx="970" cy="158" rx="250" ry="190" fill="url(#halo)" filter="url(#soft)"/>
<g fill="none" stroke="url(#violet)" opacity=".55">
 <ellipse cx="960" cy="170" rx="210" ry="88" transform="rotate(-22 960 170)" stroke-width="1.5"/>
 <ellipse cx="960" cy="170" rx="210" ry="88" transform="rotate(28 960 170)" stroke-width="1" stroke-dasharray="3 12"/>
</g>
<g fill="#f5d0fe">
 <circle cx="790" cy="78" r="2.4"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
 <circle cx="1110" cy="248" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="1018" cy="48" r="1.8"><animate attributeName="opacity" values=".15;1;.15" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<path d="M74 258H1126" stroke="#fff" stroke-opacity=".13"/>
<path d="M74 258H330" stroke="url(#violet)" stroke-width="2" stroke-dasharray="256" stroke-dashoffset="256"><animate attributeName="stroke-dashoffset" values="256;0;0" keyTimes="0;.45;1" dur="5s" repeatCount="indefinite"/></path>
<text x="76" y="155" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="3">TITAN717</text>
<text x="80" y="203" fill="#e9d5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="4">MAKING THINGS THAT FEEL RIGHT.</text>
<text x="80" y="300" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="2">INDEPENDENT BUILDER · INDIA</text>

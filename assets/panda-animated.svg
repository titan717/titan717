<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="t d">
<title id="t">Panda.fun mascot</title>
<desc id="d">The Panda.fun panda gently floats with a soft violet glow.</desc>
<defs>
  <radialGradient id="aura">
    <stop offset="0" stop-color="#a855f7" stop-opacity=".25"/>
    <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<ellipse cx="240" cy="252" rx="190" ry="190" fill="url(#aura)" filter="url(#blur)">
  <animate attributeName="opacity" values=".65;1;.65" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="rx" values="182;194;182" dur="4s" repeatCount="indefinite"/>
</ellipse>
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 5;0 0" keyTimes="0;.25;.5;.75;1" dur="4s" repeatCount="indefinite"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 240 240;1.1 240 240;0 240 240;-1.1 240 240;0 240 240" dur="6s" repeatCount="indefinite"/>
    <image x="0" y="0" width="480" height="480" href="https://raw.githubusercontent.com/titan717/titan717/main/assets/panda.webp" xlink:href="https://raw.githubusercontent.com/titan717/titan717/main/assets/panda.webp" preserveAspectRatio="xMidYMid meet"/>
  </g>
</g>
</svg>